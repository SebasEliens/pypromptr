[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "pypromptr"
version = "0.1.0"
description = "Prompt registry with swappable backends (in-memory, file, LangFuse)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sebas Eliëns", email = "sebas.eliens@gmail.com" }]
requires-python = ">=3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "frontmatter>=1.1.0",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0"]
langsmith = ["langsmith>=0.1"]
http = ["httpx>=0.27"]
s3 = ["boto3>=1.26"]
git = ["gitpython>=3.1"]
sql = ["sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/SebasEliens/pypromptr"
Repository = "https://github.com/SebasEliens/pypromptr"
Issues = "https://github.com/SebasEliens/pypromptr/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=4.0.0",
]
benchmark = [
    {include-group = "dev"},
    "gitpython>=3.1",
    "sqlalchemy>=2.0",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"').",
]
addopts = "-m 'not benchmark'"

[tool.hatch.build.targets.wheel]
packages = ["src/pypromptr"]
