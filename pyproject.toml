[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "spideyprompt"
version = "0.1.0"
description = "Prompt registry with swappable backends (in-memory, file, LangFuse)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "frontmatter>=1.1.0",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
langfuse = ["langfuse>=2.0"]

[project.urls]
Repository = "https://github.com/SebasEliens/spidey"
Issues = "https://github.com/SebasEliens/spidey/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-benchmark>=4.0.0",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"').",
]
addopts = "-m 'not benchmark'"

[tool.hatch.build.targets.wheel]
packages = ["src/spideyprompt"]
